plugins {
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
	id 'jacoco'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = "${project.archives_base_name}-fabric-${project.minecraft_version}"
}

def withRuntimeMod = { String propertyName ->
	((project.findProperty(propertyName)?.toString()?.toBoolean()) ?: false)
}
boolean withLithium = withRuntimeMod("withLithium")
boolean withJei = withRuntimeMod("withJei")
boolean withSodium = withRuntimeMod("withSodium")
boolean withIris = withRuntimeMod("withIris")
if (withIris) {
	// Iris 依赖 Sodium；单独开启 Iris 时自动补齐渲染基座。
	withSodium = true
}

repositories {
	// Prefer official repositories for stable artifact provenance.
	maven {
		name = "Fabric"
		url = "https://maven.fabricmc.net/"
	}
	maven {
		name = "Mojang"
		url = "https://libraries.minecraft.net/"
	}
	mavenCentral()
	maven {
		name = "Modrinth"
		url = "https://api.modrinth.com/maven"
		content {
			includeGroup "maven.modrinth"
		}
	}

	// Mirror repositories as fallback for unstable network links.
	maven {
		name = "AliyunPublic"
		url = "https://maven.aliyun.com/repository/public"
	}
	maven {
		name = "AliyunCentral"
		url = "https://maven.aliyun.com/repository/central"
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"redstonelink" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	runs {
		client {
			programArgs "--width", "1600", "--height", "800"
		}
	}

}

fabricApi {
	configureDataGeneration {
		client = true
		// datagen 仅用于维护和校验，不直接并入运行时资源，避免与手工保留的配方产生重复条目。
		addToResources = false
		outputDirectory = file("build/generated/datagen")
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	// Lithium runtime dependency for local runClient testing (opt-in via -PwithLithium=true).
	if (withLithium) {
		modRuntimeOnly "maven.modrinth:lithium:${project.lithium_version}"
	}
	// JEI runtime dependency for local runClient testing (opt-in via -PwithJei=true).
	if (withJei) {
		modRuntimeOnly "maven.modrinth:jei:${project.jei_version}"
	}
	// Sodium runtime dependency for local runClient testing (opt-in via -PwithSodium=true).
	if (withSodium) {
		modRuntimeOnly "maven.modrinth:sodium:${project.sodium_version}"
	}
	// Iris runtime dependency for local runClient testing (opt-in via -PwithIris=true).
	if (withIris) {
		modRuntimeOnly "maven.modrinth:iris:${project.iris_version}"
	}

	// Test baseline: JUnit 5
	testImplementation platform("org.junit:junit-bom:5.10.2")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"

}

def webappDir = file("webapp")
def webappSourceDir = file("webapp/src")
def webappPackageJson = file("webapp/package.json")
def webappPackageLock = file("webapp/package-lock.json")
def webappEntryHtml = file("webapp/index.html")
def webappTsConfig = file("webapp/tsconfig.json")
def webappViteConfig = file("webapp/vite.config.ts")
def webappOutputDir = layout.buildDirectory.dir("generated/redstonelink-webapp")
def npmCommand = System.getProperty("os.name").toLowerCase().contains("windows") ? "npm.cmd" : "npm"

tasks.register("npmInstallWebapp", Exec) {
	group = "build setup"
	description = "Install dependencies for the embedded RedstoneLink webapp."
	workingDir = webappDir
	commandLine npmCommand, "ci"
	inputs.file(webappPackageJson)
	inputs.file(webappPackageLock)
	outputs.dir(file("webapp/node_modules"))
	onlyIf {
		webappDir.exists()
	}
}

tasks.register("buildWebapp", Exec) {
	group = "build"
	description = "Build the embedded RedstoneLink webapp into generated resources."
	dependsOn(tasks.named("npmInstallWebapp"))
	workingDir = webappDir
	commandLine npmCommand, "run", "build"
	inputs.file(webappPackageJson)
	inputs.file(webappPackageLock)
	inputs.file(webappEntryHtml)
	inputs.file(webappTsConfig)
	inputs.file(webappViteConfig)
	inputs.dir(webappSourceDir)
	outputs.dir(webappOutputDir)
	doFirst {
		environment "REDSTONELINK_WEBAPP_OUT_DIR", webappOutputDir.get().asFile.absolutePath
	}
	onlyIf {
		webappDir.exists()
	}
}

processResources {
	filteringCharset = "UTF-8"
	dependsOn(tasks.named("buildWebapp"))

	def modMetadata = [
		version: project.version,
		mod_name: project.mod_name,
		mod_description: project.mod_description,
		mod_authors: project.mod_authors,
		mod_homepage: project.mod_homepage,
		mod_sources: project.mod_sources,
		mod_issues: project.mod_issues,
		mod_license: project.mod_license
	]

	inputs.properties modMetadata

	filesMatching("fabric.mod.json") {
		expand modMetadata
	}

	from(webappOutputDir) {
		into "assets/redstonelink/webapp"
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

tasks.named("test", Test).configure {
	description = "Run stable core contract tests (default verification gate)."
	useJUnitPlatform {
		includeTags "stable-core"
	}
	finalizedBy(tasks.named("jacocoTestReport"))
}

jacoco {
	toolVersion = "0.8.12"
}

tasks.named("jacocoTestReport", JacocoReport).configure {
	group = "verification"
	description = "Generate JaCoCo report for stable-core suite."
	dependsOn(tasks.named("test"))
	reports {
		xml.required = true
		html.required = true
	}
}

def taggedTestTasks = [
	[name: "testIntegration", tag: "integration", description: "Run integration tests (non-default gate)."],
	[name: "testClient", tag: "client", description: "Run client-only tests (non-default gate)."],
	[name: "testSlow", tag: "slow", description: "Run slow regression tests (non-default gate)."]
]

taggedTestTasks.each { config ->
	tasks.register(config.name, Test) {
		group = "verification"
		description = config.description
		testClassesDirs = sourceSets.test.output.classesDirs
		classpath = sourceSets.test.runtimeClasspath
		shouldRunAfter(tasks.named("test"))
		useJUnitPlatform {
			includeTags config.tag
		}
	}
}

tasks.register("testExtended") {
	group = "verification"
	description = "Run stable-core plus non-default suites."
	dependsOn(
		tasks.named("test"),
		tasks.named("testIntegration"),
		tasks.named("testClient"),
		tasks.named("testSlow")
	)
}

def coverageTasks = [
	tasks.named("test"),
	tasks.named("testIntegration"),
	tasks.named("testClient"),
	tasks.named("testSlow")
]

tasks.register("testCoverageReport", JacocoReport) {
	group = "verification"
	description = "Generate merged JaCoCo report for stable-core and extended suites."
	dependsOn(coverageTasks)
	// 修复执行数据文件路径配置
	executionData fileTree(dir: project.buildDir, includes: [
		"jacoco/test.exec",
		"jacoco/testIntegration.exec", 
		"jacoco/testClient.exec",
		"jacoco/testSlow.exec"
	])
	sourceSets(sourceSets.main)
	reports {
		xml.required = true
		html.required = true
	}
}

tasks.register("testCoverageVerification", JacocoCoverageVerification) {
	group = "verification"
	description = "Verify coverage thresholds for selected packages."
	dependsOn(coverageTasks)
	// 统一覆盖率数据来源
	executionData fileTree(dir: project.buildDir, includes: [
		"jacoco/test.exec",
		"jacoco/testIntegration.exec",
		"jacoco/testClient.exec",
		"jacoco/testSlow.exec"
	])
	sourceSets(sourceSets.main)
	classDirectories.setFrom(
		files(sourceSets.main.output).asFileTree.matching {
			include "com/makomi/data/**"
			include "com/makomi/util/**"
			include "com/makomi/network/**"
		}
	)
	violationRules {
		rule {
			element = "PACKAGE"
			includes = ["com.makomi.data*"]
			limit {
				counter = "LINE"
				value = "COVEREDRATIO"
				minimum = 0.55
			}
			limit {
				counter = "BRANCH"
				value = "COVEREDRATIO"
				minimum = 0.40
			}
		}
		rule {
			element = "PACKAGE"
			includes = ["com.makomi.util*"]
			limit {
				counter = "LINE"
				value = "COVEREDRATIO"
				minimum = 0.45
			}
			limit {
				counter = "BRANCH"
				value = "COVEREDRATIO"
				minimum = 0.35
			}
		}
		rule {
			element = "PACKAGE"
			includes = ["com.makomi.network*"]
			limit {
				counter = "LINE"
				value = "COVEREDRATIO"
				minimum = 0.70
			}
			limit {
				counter = "BRANCH"
				value = "COVEREDRATIO"
				minimum = 0.90
			}
		}
	}
}

tasks.register("testCoverage") {
	group = "verification"
	description = "Run extended suites, generate JaCoCo report, and verify coverage thresholds."
	dependsOn(tasks.named("testCoverageReport"), tasks.named("testCoverageVerification"))
}

tasks.register("testStableCore") {
	group = "verification"
	description = "Alias entry for stable core contract suite."
	dependsOn(tasks.named("test"))
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
