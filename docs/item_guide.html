<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>红石远联 全物品图鉴 / Item Guide</title>
  <style>
    :root {
      --page-bg: #f5f7fb;
      --panel-bg: #ffffff;
      --panel-border: #d9e0ea;
      --title-color: #1f2937;
      --muted-color: #64748b;
      --text-color: #1e293b;
      --badge-bg: #e0ecff;
      --badge-text: #1d4ed8;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px;
      font-family: "Segoe UI", Arial, sans-serif;
      background: var(--page-bg);
      color: var(--text-color);
    }

    .wrap {
      max-width: 1280px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .hero {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 14px;
      padding: 18px 20px;
      box-shadow: var(--shadow);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .hero-title {
      margin: 0;
      color: var(--title-color);
      font-size: 26px;
      line-height: 1.2;
    }

    .hero-subtitle {
      margin: 8px 0 0 0;
      color: var(--muted-color);
      font-size: 14px;
    }

    .hero-note {
      margin: 8px 0 0 0;
      color: #4b5563;
      font-size: 13px;
    }

    .lang-box {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .lang-label {
      font-size: 13px;
      color: #475569;
      white-space: nowrap;
    }

    .lang-btn {
      border: 1px solid #cbd5e1;
      background: #ffffff;
      color: #0f172a;
      border-radius: 8px;
      padding: 6px 10px;
      cursor: pointer;
      font-size: 13px;
    }

    .lang-btn.active {
      border-color: #2563eb;
      background: #dbeafe;
      color: #1e40af;
      font-weight: 600;
    }

    .content-layout {
      display: grid;
      grid-template-columns: 280px minmax(0, 1fr);
      gap: 14px;
      align-items: start;
    }

    .catalog-main {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .toc {
      position: sticky;
      top: 18px;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 14px;
      box-shadow: var(--shadow);
      padding: 12px;
      max-height: calc(100vh - 36px);
      overflow: auto;
    }

    .toc-title {
      margin: 0 0 8px 0;
      font-size: 16px;
      color: #0f172a;
    }

    .toc-list,
    .toc-sublist {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 6px;
    }

    .toc-item-group {
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      background: #f8fbff;
      padding: 8px;
      display: grid;
      gap: 6px;
    }

    .toc-sublist {
      max-height: 220px;
      overflow: auto;
      padding-right: 2px;
    }

    .toc-link {
      display: block;
      color: #1e293b;
      text-decoration: none;
      font-size: 13px;
      line-height: 1.3;
      border-radius: 6px;
      padding: 3px 6px;
    }

    .toc-link:hover {
      background: #dbeafe;
      color: #1e40af;
    }

    .toc-link.section {
      font-weight: 600;
      font-size: 13px;
      color: #0f172a;
      background: #eef4ff;
    }

    .toc-link.item {
      color: #334155;
      padding-left: 10px;
    }

    .category {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 14px;
      box-shadow: var(--shadow);
      padding: 14px;
      scroll-margin-top: 14px;
    }

    .category-header {
      margin-bottom: 12px;
    }

    .category-title {
      margin: 0;
      font-size: 19px;
      color: #0f172a;
    }

    .category-note {
      margin: 6px 0 0 0;
      color: #64748b;
      font-size: 13px;
    }

    .category-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .item-card {
      border: 1px solid #dbe5f0;
      border-radius: 12px;
      background: #fcfdff;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      scroll-margin-top: 14px;
    }

    .item-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }

    .item-name {
      margin: 0;
      font-size: 16px;
      color: #0f172a;
      line-height: 1.25;
    }

    .item-role {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      background: var(--badge-bg);
      color: var(--badge-text);
      font-size: 12px;
      padding: 3px 8px;
      white-space: nowrap;
    }

    .item-body {
      display: grid;
      grid-template-columns: 72px 1fr;
      gap: 10px;
      align-items: start;
    }

    .item-visual {
      width: 64px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: 1px solid #d3dee9;
      border-radius: 8px;
      overflow: hidden;
    }

    .item-icon {
      width: 52px;
      height: 52px;
      object-fit: contain;
      image-rendering: pixelated;
      border: none;
      background: transparent;
    }

    .item-fallback {
      font-size: 10px;
      color: #64748b;
      text-align: center;
      line-height: 1.3;
      padding: 0 4px;
      word-break: break-word;
    }

    .meta-line {
      margin: 0;
      font-size: 12px;
      color: #475569;
      word-break: break-all;
    }

    .meta-label {
      color: #64748b;
      margin-right: 6px;
    }

    .item-section-title {
      margin: 8px 0 4px 0;
      color: #334155;
      font-size: 13px;
      font-weight: 600;
    }

    .item-text {
      margin: 0;
      color: #1f2937;
      font-size: 13px;
      line-height: 1.5;
    }

    .item-usage {
      margin: 0;
      padding-left: 18px;
      color: #1f2937;
      font-size: 13px;
      line-height: 1.45;
      display: grid;
      gap: 3px;
    }

    .item-note {
      margin: 8px 0 0 0;
      color: #475569;
      font-size: 12px;
      line-height: 1.45;
      background: #eff6ff;
      border: 1px solid #dbeafe;
      border-radius: 8px;
      padding: 6px 8px;
    }

    .block-cube {
      position: relative;
      width: 42px;
      height: 42px;
      transform-style: preserve-3d;
      transform: rotateX(58deg) rotateZ(45deg);
    }

    .block-face {
      position: absolute;
      left: 0;
      top: 0;
      width: 42px;
      height: 42px;
      background-size: 100% 100%;
      background-repeat: no-repeat;
      background-color: transparent;
      image-rendering: pixelated;
      border: none;
      backface-visibility: hidden;
    }

    .block-top {
      transform: translateZ(21px);
      filter: brightness(1.1);
    }

    .block-left {
      transform: rotateX(-90deg) translateZ(21px);
      filter: brightness(0.9);
    }

    .block-right {
      transform: rotateY(90deg) translateZ(21px);
      filter: brightness(0.78);
    }

    .button-vanilla {
      transform: rotateX(58deg) rotateZ(45deg) scale3d(0.38, 0.26, 0.26);
      transform-origin: center center;
    }

    @media (max-width: 980px) {
      .content-layout {
        grid-template-columns: 1fr;
      }

      .toc {
        position: static;
        max-height: none;
      }

      .category-list {
        grid-template-columns: 1fr;
      }

      .hero {
        align-items: flex-start;
      }
    }
  </style>
</head>

      function withCacheBuster(url) {
        if (!url) {
          return '';
        }
        if (url.indexOf('data:') === 0) {
          return url;
        }
        return url + (url.indexOf('?') === -1 ? '?' : '&') + 'rlcb=' + ASSET_CACHE_BUSTER;
      }

      function modTextureCandidates(type, path) {
        if (!type || !path) {
          return [];
        }
        var localBase = type === 'item' ? modItemAssetBase : modBlockAssetBase;
        var candidates = [withCacheBuster(localBase + path + '.png')];
        for (var i = 0; i < modTextureRepoRefs.length; i += 1) {
          var ref = modTextureRepoRefs[i];
          candidates.push(
            withCacheBuster(
              'https://cdn.jsdelivr.net/gh/'
                + modTextureRepoOwner
                + '/'
                + modTextureRepoName
                + '@'
                + ref
                + '/src/main/resources/assets/redstonelink/textures/'
                + type
                + '/'
                + path
                + '.png'
            )
          );
          candidates.push(
            withCacheBuster(
              'https://raw.githubusercontent.com/'
                + modTextureRepoOwner
                + '/'
                + modTextureRepoName
                + '/'
                + ref
                + '/src/main/resources/assets/redstonelink/textures/'
                + type
                + '/'
                + path
                + '.png'
            )
          );
        }
        return candidates;
      }

      function textureRefToCandidates(textureRef) {
        if (!textureRef) {
          return [];
        }
        if (textureRef.indexOf('redstonelink:item/') === 0) {
          return modTextureCandidates('item', textureRef.slice('redstonelink:item/'.length));
        }
        if (textureRef.indexOf('redstonelink:block/') === 0) {
          return modTextureCandidates('block', textureRef.slice('redstonelink:block/'.length));
        }
        return [];
      }

      function textureRefToUrl(textureRef) {
        var candidates = textureRefToCandidates(textureRef);
        return candidates.length > 0 ? candidates[0] : '';
      }

      function resolveModButtonSideTextureUrl(path) {
        var sideTextureRef = modButtonSideTextureOverrides[path];
        if (!sideTextureRef) {
          return '';
        }
        return withCacheBuster(modDocsBlockAssetBase + sideTextureRef + '.png');
      }

      function resolveModButtonTopTextureUrl(path) {
        var topTextureRef = modButtonTopTextureOverrides[path];
        if (!topTextureRef) {
          return '';
        }
        return withCacheBuster(modDocsBlockAssetBase + topTextureRef + '.png');
      }

      function resolveDualLayerInnerTextureCandidates(path) {
        var innerTextureRef = modDualLayerInnerTextureOverrides[path];
        if (!innerTextureRef) {
          return [];
        }
        return textureRefToCandidates(innerTextureRef);
      }

      function appendUniqueCandidates(target, candidates) {
        if (!target || !candidates || candidates.length === 0) {
          return;
        }
        for (var i = 0; i < candidates.length; i += 1) {
          var candidate = candidates[i];
          if (candidate && target.indexOf(candidate) === -1) {
            target.push(candidate);
          }
        }
      }

      // 按“覆盖贴图 -> 约定命名 -> 远程兜底”构造候选链，和配方页保持一致。
      function iconCandidates(item) {
        var path = item.path;
        var preferBlock = item.render === 'block';
        var candidates = [];

        var override = textureOverridesByPath[path];
        if (override) {
          appendUniqueCandidates(candidates, textureRefToCandidates(override));
        }

        if (path === 'redstonelink_sync_linker') {
          appendUniqueCandidates(candidates, modTextureCandidates('item', 'redstonelink_sync_linker_0'));
          appendUniqueCandidates(candidates, modTextureCandidates('item', 'redstonelink_sync_linker_1'));
        }

        if (path === 'quick_link_tool') {
          appendUniqueCandidates(candidates, modTextureCandidates('item', 'fast_link_tool_sd'));
          appendUniqueCandidates(candidates, modTextureCandidates('item', 'fast_link_tool_cp'));
        }

        if (preferBlock) {
          appendUniqueCandidates(candidates, modTextureCandidates('block', path));
          appendUniqueCandidates(candidates, modTextureCandidates('block', path + '_blue'));
          appendUniqueCandidates(candidates, modTextureCandidates('block', path + '_blue_overlay'));
          appendUniqueCandidates(candidates, modTextureCandidates('item', path));
        } else {
          appendUniqueCandidates(candidates, modTextureCandidates('item', path));
          appendUniqueCandidates(candidates, modTextureCandidates('item', path + '_blue_overlay'));
          appendUniqueCandidates(candidates, modTextureCandidates('item', path + '_blue'));
          appendUniqueCandidates(candidates, modTextureCandidates('block', path));
          appendUniqueCandidates(candidates, modTextureCandidates('block', path + '_blue'));
          appendUniqueCandidates(candidates, modTextureCandidates('block', path + '_blue_overlay'));
        }

        return candidates;
      }

      function createCubeFace(faceClass, texture, transform, size, offset) {
        var face = document.createElement('div');
        face.className = 'block-face ' + faceClass;
        face.style.backgroundImage = texture;
        if (typeof transform === 'string' && transform) {
          face.style.transform = transform;
        }
        if (typeof size === 'number') {
          face.style.width = size + 'px';
          face.style.height = size + 'px';
        }
        if (typeof offset === 'number') {
          face.style.left = offset + 'px';
          face.style.top = offset + 'px';
        }
        return face;
      }

      function createCube(textureUrl, sideTextureUrl, innerTextureUrl) {
        var cube = document.createElement('div');
        cube.className = 'block-cube';

        var topTexture = 'url("' + textureUrl + '")';
        var sideTexture = sideTextureUrl ? 'url("' + sideTextureUrl + '"), ' + topTexture : topTexture;

        cube.appendChild(createCubeFace('block-top', topTexture));
        cube.appendChild(createCubeFace('block-left', sideTexture));
        cube.appendChild(createCubeFace('block-right', sideTexture));

        if (innerTextureUrl) {
          var innerTexture = 'url("' + innerTextureUrl + '")';
          var innerSize = 30;
          var innerOffset = 6;
          var innerDepth = 15;
          cube.appendChild(createCubeFace('block-top', innerTexture, 'translateZ(' + innerDepth + 'px)', innerSize, innerOffset));
          cube.appendChild(createCubeFace('block-left', innerTexture, 'rotateX(-90deg) translateZ(' + innerDepth + 'px)', innerSize, innerOffset));
          cube.appendChild(createCubeFace('block-right', innerTexture, 'rotateY(90deg) translateZ(' + innerDepth + 'px)', innerSize, innerOffset));
        }

        return cube;
      }

      function createButtonModel(textureUrl, path) {
        var topTextureUrl = resolveModButtonTopTextureUrl(path) || textureUrl;
        var button = createCube(topTextureUrl, resolveModButtonSideTextureUrl(path));
        button.classList.add('button-vanilla');
        return button;
      }

      function loadFirstValid(candidates, done) {
        if (!candidates || candidates.length === 0) {
          done(null);
          return;
        }
        var idx = 0;
        var probe = new Image();
        probe.onload = function () {
          done(candidates[idx]);
        };
        probe.onerror = function () {
          idx += 1;
          if (idx < candidates.length) {
            probe.src = candidates[idx];
            return;
          }
          done(null);
        };
        probe.src = candidates[idx];
      }

      // 图鉴整页重渲染时先清理旧轮播，避免语言切换后残留定时器继续操作旧 DOM。
      function clearActiveVisualIntervals() {
        while (activeVisualIntervals.length > 0) {
          window.clearInterval(activeVisualIntervals.pop());
        }
      }

      function isAttachedToDocument(node) {
        return !!node && !!document.body && document.body.contains(node);
      }

      function resolveTextureFrames(textureRefs, done) {
        if (!textureRefs || textureRefs.length === 0) {
          done([]);
          return;
        }

        var resolvedFrames = [];

        function resolveAt(index) {
          if (index >= textureRefs.length) {
            done(resolvedFrames);
            return;
          }

          loadFirstValid(textureRefToCandidates(textureRefs[index]), function (hit) {
            if (hit && resolvedFrames.indexOf(hit) === -1) {
              resolvedFrames.push(hit);
            }
            resolveAt(index + 1);
          });
        }

        resolveAt(0);
      }

      function resolveVisualFrames(item, done) {
        var rotatingTextureRefs = rotatingTextureRefsByPath[item.path];
        if (rotatingTextureRefs && rotatingTextureRefs.length > 0) {
          resolveTextureFrames(rotatingTextureRefs, function (frames) {
            if (frames.length > 0) {
              done(frames);
              return;
            }

            loadFirstValid(iconCandidates(item), function (hit) {
              done(hit ? [hit] : []);
            });
          });
          return;
        }

        loadFirstValid(iconCandidates(item), function (hit) {
          done(hit ? [hit] : []);
        });
      }

      function renderFallbackVisual(visualEl, item) {
        visualEl.textContent = '';
        var fallback = document.createElement('div');
        fallback.className = 'item-fallback';
        fallback.textContent = item.path;
        visualEl.appendChild(fallback);
      }

      function renderResolvedVisual(visualEl, item, textureUrl) {
        visualEl.textContent = '';

        if (item.render === 'block') {
          renderBlockVisual(visualEl, textureUrl, item.path);
          return;
        }

        if (item.render === 'button') {
          visualEl.appendChild(createButtonModel(textureUrl, item.path));
          return;
        }

        var icon = document.createElement('img');
        icon.className = 'item-icon';
        icon.src = textureUrl;
        icon.alt = item.path;
        visualEl.appendChild(icon);
      }

      function renderVisualFrames(visualEl, item, frames) {
        var renderToken = String(Date.now()) + Math.random();
        visualEl.setAttribute('data-visual-sequence-token', renderToken);

        if (!frames || frames.length === 0) {
          renderFallbackVisual(visualEl, item);
          return;
        }

        var currentIndex = 0;
        renderResolvedVisual(visualEl, item, frames[currentIndex]);

        if (frames.length < 2) {
          return;
        }

        var intervalId = window.setInterval(function () {
          if (!isAttachedToDocument(visualEl) || visualEl.getAttribute('data-visual-sequence-token') !== renderToken) {
            window.clearInterval(intervalId);
            return;
          }

          currentIndex = (currentIndex + 1) % frames.length;
          renderResolvedVisual(visualEl, item, frames[currentIndex]);
        }, iconRotationIntervalMs);

        activeVisualIntervals.push(intervalId);
      }

      function renderBlockVisual(visualEl, textureUrl, path) {
        var renderToken = String(Date.now()) + Math.random();
        visualEl.setAttribute('data-block-render-token', renderToken);
        visualEl.textContent = '';
        visualEl.appendChild(createCube(textureUrl, '', ''));

        var innerTextureCandidates = resolveDualLayerInnerTextureCandidates(path);
        if (innerTextureCandidates.length === 0) {
          return;
        }

        loadFirstValid(innerTextureCandidates, function (innerHit) {
          if (!innerHit || visualEl.getAttribute('data-block-render-token') !== renderToken) {
            return;
          }
          visualEl.textContent = '';
          visualEl.appendChild(createCube(textureUrl, '', innerHit));
        });
      }

      function renderVisual(visualEl, item) {
        var requestToken = String(Date.now()) + Math.random();
        visualEl.setAttribute('data-visual-request-token', requestToken);

        resolveVisualFrames(item, function (frames) {
          if (visualEl.getAttribute('data-visual-request-token') !== requestToken) {
            return;
          }

          renderVisualFrames(visualEl, item, frames);
        });
      }

      function createFieldTitle(text) {
        var title = document.createElement('div');
        title.className = 'item-section-title';
        title.textContent = text;
        return title;
      }

      function localizedText(content) {
        return content && content[currentLang] ? content[currentLang] : '';
      }

      function categorySectionId(categoryKey) {
        return 'category-' + categoryKey;
      }

      function itemAnchorId(itemPath) {
        return 'item-' + itemPath;
      }

      function createTocLink(targetId, text, linkClass) {
        var link = document.createElement('a');
        link.className = 'toc-link ' + linkClass;
        link.href = '#' + targetId;
        link.textContent = text;
        return link;
      }

      function renderToc() {
        var ui = uiText[currentLang];
        var toc = document.getElementById('toc');
        if (!toc) {
          return;
        }
        toc.textContent = '';

        var title = document.createElement('h2');
        title.className = 'toc-title';
        title.textContent = ui.tocTitle;
        toc.appendChild(title);

        var categoryList = document.createElement('ul');
        categoryList.className = 'toc-list';

        categoryOrder.forEach(function (categoryKey) {
          var categoryDef = ui.categories[categoryKey];
          var grouped = items.filter(function (item) {
            return item.category === categoryKey;
          });

          if (grouped.length === 0) {
            return;
          }

          var groupItem = document.createElement('li');
          groupItem.className = 'toc-item-group';

          groupItem.appendChild(
            createTocLink(
              categorySectionId(categoryKey),
              categoryDef.title + ' (' + grouped.length + ')',
              'section'
            )
          );

          var subList = document.createElement('ul');
          subList.className = 'toc-sublist';
          grouped.forEach(function (item) {
            var subItem = document.createElement('li');
            subItem.appendChild(
              createTocLink(itemAnchorId(item.path), localizedText(item.name), 'item')
            );
            subList.appendChild(subItem);
          });

          groupItem.appendChild(subList);
          categoryList.appendChild(groupItem);
        });

        toc.appendChild(categoryList);
      }

      function createItemCard(item) {
        var ui = uiText[currentLang];
        var article = document.createElement('article');
        article.className = 'item-card';
        article.id = itemAnchorId(item.path);

        var head = document.createElement('div');
        head.className = 'item-head';

        var name = document.createElement('h3');
        name.className = 'item-name';
        name.textContent = localizedText(item.name);

        var role = document.createElement('span');
        role.className = 'item-role';
        role.textContent = ui.roles[item.role] || item.role;

        head.appendChild(name);
        head.appendChild(role);

        var body = document.createElement('div');
        body.className = 'item-body';

        var visual = document.createElement('div');
        visual.className = 'item-visual';
        renderVisual(visual, item);

        var info = document.createElement('div');

        var idLine = document.createElement('p');
        idLine.className = 'meta-line';
        idLine.innerHTML = '<span class="meta-label">' + ui.labels.id + ':</span>redstonelink:' + item.path;
        info.appendChild(idLine);

        info.appendChild(createFieldTitle(ui.labels.effect));
        var effect = document.createElement('p');
        effect.className = 'item-text';
        effect.textContent = localizedText(item.effect);
        info.appendChild(effect);

        info.appendChild(createFieldTitle(ui.labels.usage));
        var usageList = document.createElement('ol');
        usageList.className = 'item-usage';
        var usageItems = localizedText(item.usage);
        usageItems.forEach(function (entry) {
          var li = document.createElement('li');
          li.textContent = entry;
          usageList.appendChild(li);
        });
        info.appendChild(usageList);

        if (item.note) {
          var note = document.createElement('p');
          note.className = 'item-note';
          note.textContent = ui.labels.note + ': ' + localizedText(item.note);
          info.appendChild(note);
        }

        body.appendChild(visual);
        body.appendChild(info);

        article.appendChild(head);
        article.appendChild(body);
        return article;
      }

      function renderCatalog() {
        var ui = uiText[currentLang];
        var host = document.getElementById('catalog');
        clearActiveVisualIntervals();
        host.textContent = '';

        categoryOrder.forEach(function (categoryKey) {
          var categoryDef = ui.categories[categoryKey];
          var grouped = items.filter(function (item) {
            return item.category === categoryKey;
          });

          if (grouped.length === 0) {
            return;
          }

          var section = document.createElement('section');
          section.className = 'category';
          section.id = categorySectionId(categoryKey);

          var header = document.createElement('div');
          header.className = 'category-header';

          var title = document.createElement('h2');
          title.className = 'category-title';
          title.textContent = categoryDef.title + ' (' + grouped.length + ')';

          var note = document.createElement('p');
          note.className = 'category-note';
          note.textContent = categoryDef.note;

          header.appendChild(title);
          header.appendChild(note);

          var list = document.createElement('div');
          list.className = 'category-list';

          grouped.forEach(function (item) {
            list.appendChild(createItemCard(item));
          });

          section.appendChild(header);
          section.appendChild(list);
          host.appendChild(section);
        });
      }

      // 语言切换采用“整页重渲染”方式，确保标题、分组、字段与内容一次性切换。
      function updatePageText() {
        var ui = uiText[currentLang];
        document.documentElement.lang = currentLang === 'zh' ? 'zh-CN' : 'en';
        document.getElementById('page-title').textContent = ui.pageTitle;
        document.getElementById('page-subtitle').textContent = ui.pageSubtitle;
        document.getElementById('source-note').textContent = ui.sourceNote;
        document.getElementById('lang-label').textContent = ui.langLabel;

        document.getElementById('lang-zh').classList.toggle('active', currentLang === 'zh');
        document.getElementById('lang-en').classList.toggle('active', currentLang === 'en');
      }

      function switchLanguage(lang) {
        currentLang = lang === 'en' ? 'en' : 'zh';
        updatePageText();
        renderCatalog();
        renderToc();
      }

      document.getElementById('lang-zh').addEventListener('click', function () {
        switchLanguage('zh');
      });

      document.getElementById('lang-en').addEventListener('click', function () {
        switchLanguage('en');
      });

      switchLanguage('zh');
    })();
  </script>
</body>
</html>
